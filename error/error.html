<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web en construcción</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center; 
            align-items: center;     
            background-color: #f4f4f4; 
        }

        .principal {
            border: 5px solid black;
            padding: 20px 100px;     
            text-align: center;      
            background-color: white; 
            border-radius: 10px;    
        }

        .principal p {
            font-size: 4rem;         
            margin: 0 0 20px 0;      
            font-weight: bold;
            font-family: sans-serif;
        }

        .principal input {
            font-size: 1.5rem;       
            padding: 10px 30px;      
            cursor: pointer;        
        }


    </style>
</head>
<body>
    <div class="principal">     
        <p>Error 404</p>
        <a href="/"><input type="button" value="Volver"></a>
    </div>   
</body>
</html>
